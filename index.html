<!doctype html>
<html lang="da" data-theme="dark">
<head>
<meta charset="utf-8">
<title>File Command Center</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23111d20'/%3E%3Crect x='5' y='5' width='10' height='10' fill='%234fd6a0'/%3E%3Crect x='17' y='5' width='10' height='10' fill='%23ffb02e'/%3E%3Crect x='5' y='17' width='10' height='10' fill='%23ffb02e'/%3E%3Crect x='17' y='17' width='10' height='10' fill='%234fd6a0'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0a1113;--bg2:#0e1a1d;--panel:#111d20;--panel2:#172a2e;--line:#243b40;--line2:#33525a;
  --text:#e3efee;--muted:#92aaa9;--dim:#627c7c;
  --accent:#ffb02e;--ok:#4fd6a0;--bad:#ff5d6c;--warn:#ffb02e;
  --grid:rgba(126,190,190,.05);
  --display:"Bahnschrift SemiCondensed","Bahnschrift","Segoe UI Semibold","Segoe UI",system-ui,sans-serif;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"Cascadia Mono","Cascadia Code",Consolas,monospace;
  --r:6px;
}
:root[data-theme=light]{
  --bg:#e8eeef;--bg2:#dfe8e9;--panel:#f7fafa;--panel2:#edf3f3;--line:#c3d2d4;--line2:#a9bec1;
  --text:#0e2124;--muted:#48626a;--dim:#7a9297;--accent:#b86e00;--ok:#0f9a6a;--bad:#d1283a;--warn:#b86e00;--grid:rgba(20,70,80,.06);
}
html{color-scheme:dark}
:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 var(--sans);color:var(--text);background:var(--bg);min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:40px 40px;-webkit-mask-image:linear-gradient(180deg,#000,transparent 70%);mask-image:linear-gradient(180deg,#000,transparent 70%)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}.sm{font-size:12px}

/* layout */
.app{display:grid;grid-template-columns:262px minmax(0,1fr);min-height:100vh;position:relative;z-index:1}
.side{position:sticky;top:0;height:100vh;overflow:auto;padding:18px 12px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--bg2) 92%,transparent);display:flex;flex-direction:column;gap:2px}
.main{padding:26px 34px 90px;max-width:1560px;width:100%}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 16px}
.logo{display:grid;grid-template-columns:1fr 1fr;gap:3px;width:30px;height:30px;flex:none}
.logo i{display:block;background:var(--ok)}.logo i:nth-child(2),.logo i:nth-child(3){background:var(--accent)}
.brand b{display:block;font:600 17px var(--display);letter-spacing:.01em;line-height:1.1}
.brand small{color:var(--dim);font-size:12px}
.nav{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r);color:var(--muted);text-decoration:none;cursor:pointer;border:1px solid transparent;border-left:3px solid transparent}
.nav:hover{background:var(--panel);color:var(--text)}
.nav.on{background:var(--panel);color:var(--text);border-color:var(--line);border-left-color:var(--c,var(--accent))}
.nav .ico{width:20px;text-align:center;flex:none}
.nav .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .n{font:12px var(--mono);color:var(--dim)}
.nav .edit{opacity:0;color:var(--dim);padding:0 2px}
.nav:hover .edit{opacity:1}.nav .edit:hover{color:var(--accent)}
.sec{font:600 13px var(--display);color:var(--dim);padding:16px 10px 4px;display:flex;justify-content:space-between;align-items:center;letter-spacing:.03em}
.sec button{background:none;border:0;color:var(--dim);cursor:pointer;font-size:16px;line-height:1;padding:2px 6px;border-radius:4px}
.sec button:hover{color:var(--accent);background:var(--panel)}
.side .grow{flex:1}
.sidefoot{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:6px;font-size:12px;color:var(--muted)}
.sidefoot .r{display:flex;gap:8px;align-items:center}

/* top */
.top{display:flex;align-items:flex-end;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.top .sub{color:var(--dim);font-size:12.5px}
.top h1{font:600 30px/1.1 var(--display);margin:2px 0 0;letter-spacing:.005em}
.spacer{flex:1}
.btn{appearance:none;border:1px solid var(--line2);background:var(--panel);color:var(--text);padding:7px 13px;border-radius:var(--r);cursor:pointer;display:inline-flex;gap:8px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}
.btn.pri:hover{background:var(--accent);border-color:var(--accent);color:#1a1100}
.btn.danger{color:var(--bad)}.btn.danger:hover{border-color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:default}
kbd{font:11px var(--mono);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted)}
.ib{background:none;border:0;color:var(--dim);cursor:pointer;font-size:16px;line-height:1;padding:5px 7px;border-radius:5px}
.ib:hover{background:var(--panel2);color:var(--text)}.ib.on{color:var(--accent)}

/* hero */
.hero{margin-bottom:26px}
.hero .date{color:var(--muted);margin-bottom:4px}
.hero h1{font:600 clamp(30px,4.2vw,50px)/1.05 var(--display);margin:0 0 6px;letter-spacing:.005em}
.hero .lede{color:var(--muted);margin:0 0 16px;max-width:70ch}
.strip{display:flex;flex-wrap:wrap;gap:3px;max-width:900px}
.cell{width:16px;height:22px;border:0;padding:0;cursor:pointer;background:var(--line2);border-bottom:3px solid var(--c,var(--dim));border-radius:2px 2px 0 0}
.cell.ok{background:var(--ok)}.cell.bad{background:var(--bad);animation:pulse 1.6s ease-in-out infinite}.cell.warn{background:var(--warn)}.cell.url{background:#7cc4ff}
.cell:hover{filter:brightness(1.25)}
@keyframes pulse{50%{opacity:.45}}
.legend{display:flex;gap:16px;margin-top:10px;color:var(--dim);font-size:12px;flex-wrap:wrap}
.legend span{display:inline-flex;gap:6px;align-items:center}

/* panels + tiles */
.h2{font:600 19px var(--display);margin:0 0 12px;letter-spacing:.01em;display:flex;align-items:center;gap:10px}
.h2 .ct{font:12px var(--mono);color:var(--dim)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:28px}
.tile{position:relative;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:var(--r);padding:14px 16px 14px;background:var(--panel);cursor:pointer;display:grid;gap:6px;text-align:left;min-height:118px}
.tile:hover{border-color:var(--c);background:var(--panel2)}
.tile .ti{display:flex;align-items:center;gap:10px}
.tile .em{font-size:26px;line-height:1}
.tile b{font:600 20px var(--display)}
.tile .kind{margin-left:auto;font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:0 8px}
.tile.hub .kind{color:var(--c);border-color:var(--c)}
.tile p{margin:0;color:var(--muted);font-size:13px}
.tile .tt{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.tile .tt span{font-size:12px;color:var(--muted);background:var(--panel2);border-radius:4px;padding:0 6px}
.tile.new{border-style:dashed;border-left-width:1px;border-color:var(--line2);place-content:center;justify-items:center;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.panel .h2{font-size:16px}
.mini{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:5px;cursor:pointer;margin:0 -8px}
.mini:hover{background:var(--panel2)}
.mini .mt{flex:1;min-width:0}.mini .mt b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .mt small{color:var(--muted);font-size:12px}
.mini .x{font-size:12.5px;color:var(--muted);text-align:right;max-width:46%}
.x.bad{color:var(--bad)}.x.warn{color:var(--warn)}
.hint{color:var(--dim);font-size:13px;padding:6px 0}
.onboard{border:1px dashed var(--line2);border-radius:var(--r);padding:22px 24px;margin-bottom:26px;background:var(--panel)}
.onboard h2{font:600 22px var(--display);margin:0 0 6px}
.onboard p{margin:0 0 14px;color:var(--muted);max-width:75ch}
.onboard .acts{display:flex;gap:8px;flex-wrap:wrap}

/* library toolbar */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{flex:1;min-width:240px;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);padding:8px 12px}
.search:focus{border-color:var(--accent);outline:none}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden}
.seg button{background:var(--panel);border:0;padding:7px 12px;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--panel2);color:var(--accent);font-weight:600}
select,input:not([type=checkbox]):not([type=file]),textarea{background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r);padding:7px 10px;width:auto}
select{padding:7px 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.chips .lab{color:var(--dim);font-size:13px;margin-right:4px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);color:var(--muted);font-size:12.5px;cursor:pointer;line-height:1.6}
.chip:hover{border-color:var(--accent);color:var(--text)}
.chip.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--panel))}
.chip .ct{font:11px var(--mono);opacity:.7}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--dim));display:inline-block}
.chip.ghost{border-style:dashed;background:transparent}
.gridhead{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.resinfo{color:var(--dim);margin:6px 0 12px}

/* file cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--c,var(--line2));border-radius:var(--r);padding:12px 14px;display:grid;gap:8px;align-content:start}
.card:hover{border-color:var(--line2);border-top-color:var(--c)}
.card.arch,.row.arch{opacity:.6}
.card-top{display:flex;gap:6px;align-items:flex-start}
.card-main{flex:1;min-width:0;display:flex;gap:10px;cursor:pointer}
.ttl{min-width:0;display:grid}
.ttl b{font:600 16px/1.25 var(--display);overflow-wrap:anywhere}
.catpill{font-size:12px;color:var(--muted);white-space:nowrap}
.path{color:var(--dim);overflow-wrap:anywhere}
.desc{margin:0;color:var(--muted);font-size:13px}
.due{font-size:12.5px}.due.bad{color:var(--bad)}.due.warn{color:var(--warn)}.due.ok{color:var(--muted)}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tags .chip{padding:0 8px;font-size:12px}
.foot{display:flex;align-items:center;gap:8px;margin-top:2px}
.foot .meta{flex:1;font-size:12px;color:var(--dim)}
.ftype{flex:none;width:34px;height:34px;display:grid;place-items:center;border-radius:4px;font:700 12px var(--display);letter-spacing:.02em}
.led{width:9px;height:9px;border-radius:50%;background:var(--dim);display:inline-block;flex:none}
.led.ok{background:var(--ok);box-shadow:0 0 8px color-mix(in srgb,var(--ok) 70%,transparent)}
.led.bad{background:var(--bad);box-shadow:0 0 8px color-mix(in srgb,var(--bad) 70%,transparent)}
.led.warn{background:var(--warn)}.led.url{background:#7cc4ff}

/* list rows */
.rows{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.rowh,.row{display:grid;grid-template-columns:36px minmax(0,2.4fr) 150px minmax(0,1.6fr) 96px 20px 70px;gap:12px;align-items:center;padding:8px 12px}
.rowh{color:var(--dim);font-size:12.5px;border-bottom:1px solid var(--line);background:var(--bg2)}
.row{border-top:1px solid var(--line)}.rowh+.row{border-top:0}
.row:hover{background:var(--panel2)}
.row-t{cursor:pointer;min-width:0}.row-t b{display:block;font-weight:600}.row-t small{color:var(--dim)}
.acts{display:flex;justify-content:flex-end}

/* hub */
.hubhead{display:grid;gap:12px;margin-bottom:14px}
.hubhead .stats{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted)}
.hubhead .stats b{font:600 20px var(--display);color:var(--text);margin-right:5px}
.hubgrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:14px;margin-bottom:26px;align-items:start}
.launch{display:flex;flex-wrap:wrap;gap:8px}
.launch button{display:flex;align-items:center;gap:9px;background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--c);border-radius:var(--r);padding:8px 12px;cursor:pointer;text-align:left}
.launch button:hover{border-color:var(--c);background:var(--bg2)}
.notes{width:100%;min-height:150px;resize:vertical;font-family:var(--sans);line-height:1.5}
.duechips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}

/* dialogs */
dialog{border:1px solid var(--line2);background:var(--panel);color:var(--text);border-radius:8px;padding:0;width:min(680px,94vw);box-shadow:0 30px 90px rgba(0,0,0,.55);overflow:visible}
dialog::backdrop{background:rgba(2,8,10,.66)}
.dlg-h{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg-h h2{margin:0;font:600 20px var(--display);flex:1}
.dlg-h .x{background:none;border:0;cursor:pointer;color:var(--muted);font-size:16px;padding:4px 8px}
.dlg-b{padding:16px 18px;max-height:68vh;overflow:auto}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);align-items:center}
.dlg-f .spacer{flex:1}
.fld{display:grid;gap:5px;margin-bottom:13px}
.fld>span{font-size:13px;color:var(--muted)}
.fld small{color:var(--dim);font-size:12px}
.fld input,.fld select,.fld textarea{width:100%}
.fld textarea{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.inl{display:flex;gap:8px}.inl input{flex:1}
.chk{display:flex;gap:8px;align-items:center;margin-bottom:13px;cursor:pointer}
.taginput{display:flex;flex-wrap:wrap;gap:5px;align-items:center;background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r);padding:5px 7px}
.taginput input{border:0!important;background:none!important;flex:1;min-width:140px;padding:3px 4px!important}
.taginput .chip .x{cursor:pointer;margin-left:2px;font-weight:700}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:5px;border:2px solid transparent;cursor:pointer;background:var(--c)}
.sw.on{border-color:var(--text)}
.emojis{display:flex;gap:2px;flex-wrap:wrap;margin-top:4px}.emojis button{background:none;border:0;cursor:pointer;font-size:19px;padding:2px 4px;border-radius:4px}.emojis button:hover{background:var(--panel2)}
.imp{display:grid;gap:4px}
.imp-r{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:center;padding:5px 6px;border-radius:5px}
.imp-r:hover{background:var(--panel2)}
.imp-r input[type=text],.imp-r input:not([type]){width:100%;padding:4px 8px}
.imp-r small{grid-column:2;color:var(--dim);font-family:var(--mono);font-size:11.5px;overflow-wrap:anywhere}
.imp-r .dupe{color:var(--warn);font-family:var(--sans)}

.bl{border:1px solid var(--line);border-radius:var(--r);height:44vh;overflow:auto;margin-top:10px;background:var(--bg2)}
.bl-r{display:flex;align-items:center;gap:10px;padding:6px 10px;cursor:pointer;border-bottom:1px solid var(--line)}
.bl-r:hover{background:var(--panel2)}
.bl-r.sel{background:color-mix(in srgb,var(--accent) 13%,var(--panel))}
.bl-r .bi{width:20px;text-align:center;flex:none}.bl-r .bn{flex:1;min-width:0;overflow-wrap:anywhere}.bl-r .bm{color:var(--dim);font-size:12px;white-space:nowrap}
.bl .hint{padding:14px}
.bl-r .cb{cursor:pointer;width:26px;font-size:16px}.bl-r .cb:hover{color:var(--accent)}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;margin:8px 0 0;font-size:13px}
.crumb{background:none;border:0;color:var(--muted);cursor:pointer;padding:2px 6px;border-radius:4px}
.pickbox{font-size:20px;line-height:1;color:var(--dim);flex:none;padding-top:5px}
.card.selmode,.row.selmode{cursor:pointer;user-select:none}
.card.picked,.row.picked{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--panel))}
.card.picked{box-shadow:0 0 0 1px var(--accent)}
.card.picked .pickbox,.row.picked .pickbox{color:var(--accent)}
.rows.selmode .rowh,.rows.selmode .row{grid-template-columns:24px 36px minmax(0,2.4fr) 150px minmax(0,1.6fr) 96px 20px 70px}
.selbar{position:fixed;z-index:40;bottom:18px;left:calc(262px + 24px);right:24px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--accent);border-radius:8px;padding:10px 14px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.selbar .sep{width:1px;height:22px;background:var(--line2);margin:0 4px}
@media (max-width:900px){.selbar{left:12px;right:12px}}
.chip.cust .x{cursor:pointer;margin-left:2px;font-weight:700;color:var(--dim)}.chip.cust .x:hover{color:var(--bad)}
.chip[disabled]{opacity:.45;cursor:default}
.crumb:hover{background:var(--panel2);color:var(--text)}

/* tag-farver */
.chip.tc{border-color:color-mix(in srgb,var(--tc) 50%,var(--line2));background:color-mix(in srgb,var(--tc) 13%,var(--panel));color:var(--text)}
.chip.tc:hover{border-color:var(--tc)}
.chip.tc.on{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 28%,var(--panel));box-shadow:0 0 0 1px var(--tc)}
.tm-r{display:flex;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tm-r .nm{width:170px;flex:none}.tm-r .n{width:34px;text-align:right;color:var(--dim);font:12px var(--mono);flex:none}
.swrow{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.sw.sm{width:17px;height:17px;border-radius:4px;border-width:2px;padding:0}
.sw.none{background:transparent;border:1px dashed var(--line2);color:var(--dim);font-size:11px;line-height:13px}
/* forhåndsvisning */
.pvt{border-collapse:collapse;font:11px/1.35 var(--mono);width:100%}
.pvt th,.pvt td{border:1px solid var(--line);padding:1px 6px;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis;text-align:left}
.pvt th{background:var(--panel2);color:var(--dim);font-weight:400;position:sticky;top:0}
.pvt td.rn,.pvt th.rn{color:var(--dim);background:var(--panel2);text-align:right;width:1%}
.pvt td.num{text-align:right}
.pv-msg{display:block;color:var(--dim);font-size:12px;padding:6px 8px}
.pv-dlg-table{max-height:56vh;overflow:auto;border:1px solid var(--line);border-radius:4px}
.pv-dlg-table .pvt{font-size:12px}.pv-dlg-table .pvt th,.pv-dlg-table .pvt td{max-width:260px}
.pv-note{color:var(--dim);font-size:12px;margin-top:8px}
.pane{display:none;position:sticky;top:0;height:100vh;border-left:1px solid var(--line);background:color-mix(in srgb,var(--bg2) 92%,transparent)}
.app.haspane{grid-template-columns:262px minmax(0,1fr) var(--pane-w,420px)}
.pane-inner{flex:1;min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:8px;padding:18px 16px}
.pane-grip{position:absolute;top:0;bottom:0;left:-7px;width:14px;cursor:col-resize;z-index:2;touch-action:none}
.pane-grip::after{content:"";position:absolute;top:0;bottom:0;left:6px;width:2px;background:transparent}
.pane-grip:hover::after,body.pane-dragging .pane-grip::after{background:var(--accent)}
body.pane-dragging{cursor:col-resize;user-select:none}
.app.haspane .pane{display:flex}
.app.haspane .card,.app.haspane .row{cursor:pointer}
.card.pvsel,.row.pvsel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--panel))}
.card.pvsel{box-shadow:0 0 0 1px var(--accent)}
.pane-head{display:flex;align-items:center;gap:8px}
.pane-head b{font:600 16px var(--display);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pane-meta{overflow-wrap:anywhere}
.pane-body{flex:1;min-height:0;display:flex;flex-direction:column}
.pane .pv-dlg-table{max-height:none;flex:1;min-height:0}
.pv-img{max-width:100%;max-height:100%;margin:auto;display:block;object-fit:contain}
.pane-body:has(.pv-img){align-items:center;justify-content:center}
.pv-pdf{flex:1;width:100%;min-height:0;border:0;background:#fff;border-radius:4px}
.pv-text{flex:1;min-height:0;overflow:auto;margin:0;padding:10px 12px;background:var(--bg2);border:1px solid var(--line);border-radius:4px;font:12px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word}

/* menu, toast, banner, palette */
.menu{position:fixed;z-index:60;min-width:210px;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:5px;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.menu button{display:flex;width:100%;text-align:left;background:none;border:0;padding:7px 10px;border-radius:5px;cursor:pointer;gap:8px}
.menu button:hover{background:var(--panel2)}.menu button.danger{color:var(--bad)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.toasts{position:fixed;right:18px;bottom:18px;display:grid;gap:8px;z-index:200;pointer-events:none}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--accent);border-radius:var(--r);padding:9px 14px;max-width:420px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.ok{border-left-color:var(--ok)}.toast.bad{border-left-color:var(--bad)}
.banner{border:1px solid var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--panel));border-radius:var(--r);padding:10px 14px;margin-bottom:16px}
dialog.pal{margin:11vh auto 0;width:min(660px,94vw)}
.pal-in{width:100%;border:0!important;border-bottom:1px solid var(--line)!important;border-radius:8px 8px 0 0!important;padding:16px 18px!important;font-size:17px;background:var(--panel)!important}
.pal-in:focus{outline:none}
.pal-list{max-height:52vh;overflow:auto;padding:6px}
.pal-i{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer}
.pal-i.on{background:var(--panel2);box-shadow:inset 3px 0 0 var(--accent)}
.pal-i .mt{flex:1;min-width:0}.pal-i .mt b{display:block;font-weight:600}.pal-i .mt small{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.pal-i .k{font-size:12px;color:var(--dim)}
.pal-hint{border-top:1px solid var(--line);padding:8px 16px;color:var(--dim);font-size:12px}
body.dragging::after{content:"Slip filerne her";position:fixed;inset:14px;z-index:300;display:grid;place-items:center;border:2px dashed var(--accent);border-radius:12px;background:color-mix(in srgb,var(--bg) 85%,transparent);font:600 28px var(--display);color:var(--accent);pointer-events:none}


/* manual */
.manual-wrap{display:grid;grid-template-columns:210px minmax(0,1fr);gap:36px;align-items:start}
.toc{position:sticky;top:20px;display:grid;gap:2px}
.toc b{font:600 16px var(--display);margin-bottom:6px}
.toc .crumb{text-align:left;padding:4px 8px}
.manual{max-width:80ch;line-height:1.6}
.manual h2{font:600 26px/1.2 var(--display);margin:40px 0 8px;padding-top:26px;border-top:1px solid var(--line)}
.manual h2:first-child{margin-top:0;padding-top:0;border:0}
.manual h3{font:600 18px var(--display);margin:22px 0 4px}
.manual p{margin:6px 0}
.manual ul,.manual ol{padding-left:22px;margin:6px 0}.manual li{margin:4px 0}
.manual code{font:12.5px var(--mono);background:var(--panel2);padding:1px 6px;border-radius:4px;overflow-wrap:anywhere}
.manual table{border-collapse:collapse;width:100%;margin:10px 0;font-size:13.5px}
.manual th,.manual td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.manual th{background:var(--panel2)}
.manual .note{border-left:3px solid var(--accent);background:var(--panel);padding:9px 14px;margin:14px 0;border-radius:0 var(--r) var(--r) 0}
.manual a{color:var(--accent)}
@media (max-width:900px){.manual-wrap{grid-template-columns:1fr}.toc{position:static}}
@media print{
  :root,:root[data-theme]{--bg:#fff;--bg2:#fff;--panel:#fff;--panel2:#f0f0f0;--line:#bbb;--line2:#999;--text:#000;--muted:#333;--dim:#555;--accent:#7a4a00}
  body::before,.side,.pane,.toc,.top .btn,.top .spacer,.toasts{display:none!important}
  .app{display:block}.main{padding:0;max-width:none}.manual-wrap{display:block}.manual{max-width:none}
  .manual h2{break-after:avoid}.manual table,.manual .note{break-inside:avoid}
}

@media (max-width:900px){.app,.app.haspane{grid-template-columns:1fr}.pane{position:static;height:auto}.pane-grip{display:none}.side{position:static;height:auto}.main{padding:18px}.hubgrid{grid-template-columns:1fr}.rowh,.row{grid-template-columns:36px 1fr 20px 70px}.rowh>:nth-child(3),.rowh>:nth-child(4),.rowh>:nth-child(5),.row>.catpill,.row>.tags,.row>.muted{display:none}}
@media (prefers-reduced-motion:reduce){.cell.bad{animation:none}}
</style>
</head>
<body>
<div class="app"><aside class="side" id="side"></aside><main class="main" id="main"></main><aside class="pane" id="pane"><div class="pane-grip" id="panegrip" title="Træk for at ændre bredden"></div><div class="pane-inner" id="paneinner"></div></aside></div>
<datalist id="taglist"></datalist>
<script>
'use strict';
/* ================= Konstanter ================= */
const CAT_COLORS=['#5eead4','#ffb02e','#7cc4ff','#f28ab2','#b7a4ff','#9be564','#ff8a5c','#e6d36f','#8fa9ff','#a3b6b5'];
const EMOJIS=['📊','♻️','💰','📦','🧾','📈','🗂️','⚙️','🏭','🧮','📅','🔧','🌍','🧪','🚚','👥'];
const SORTS={recent:'Senest brugt',name:'Navn A–Å',opens:'Mest brugt',modified:'Sidst ændret (fil)',added:'Senest tilføjet',due:'Frist'};
const TYPES={excel:['X','#1d7a46','#fff'],'excel-url':['X','#1d7a46','#fff'],csv:['CSV','#3f8f6f','#fff'],pbi:['BI','#f2c811','#1a1a1a'],word:['W','#2b5eb8','#fff'],pdf:['PDF','#c8382d','#fff'],ppt:['P','#d2582b','#fff'],folder:['📁','var(--panel2)','var(--text)'],link:['🔗','var(--panel2)','var(--text)'],other:['•','var(--panel2)','var(--muted)']};

/* ================= State ================= */
let S=null;                 // gemmes i data.json via hjælperen
const H={};                 // filstatus fra hjælperen: sti -> {exists,size,modified,timeout}
let helperOnline=true,dirty=false,saveTimer=null,savePromise=Promise.resolve(),saveMsg='';
const UI={q:'',tags:new Set(),tagMode:'and',status:'aktiv',fav:false,cat:'',problem:false,allTags:false,select:false,sel:new Set(),order:[],last:null,pv:null};

function defaultState(){return{version:1,categories:[
  {id:'affaldsdata',name:'Affaldsdata',icon:'♻️',color:'#5eead4',hub:true,description:'',notes:''},
  {id:'oekonomi',name:'Økonomi',icon:'💰',color:'#ffb02e',hub:true,description:'',notes:''},
  {id:'stamdata',name:'Stamdata',icon:'🗂️',color:'#7cc4ff',hub:true,description:'',notes:''},
  {id:'diverse',name:'Diverse',icon:'📎',color:'#b7a4ff',hub:true,description:'',notes:''}],
  files:[],settings:{theme:'dark',view:'cards',sort:'recent',paneWidth:420}}}
function migrate(s){s.categories=Array.isArray(s.categories)?s.categories:[];s.categories.forEach(k=>{k.hub=true});s.files=Array.isArray(s.files)?s.files:[];
  s.settings=Object.assign({theme:'dark',view:'cards',sort:'recent',paneWidth:420},s.settings||{});
  const ids=new Set();
  s.files.forEach(f=>{f.tags=f.tags||[];f.status=f.status||'aktiv';f.opens=f.opens||0;f.category=f.category||'';if(!f.id||ids.has(f.id)) f.id=uid();ids.add(f.id)});return s}

/* ================= Hjælpefunktioner ================= */
function h(tag,props,...kids){
  const el=document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(v==null||v===false) continue;
    if(k==='class') el.className=v;
    else if(k==='style'){for(const [a,b] of Object.entries(v)){a.startsWith('--')?el.style.setProperty(a,b):(el.style[a]=b)}}
    else if(k.length>2&&k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(),v);
    else if(v===true) el.setAttribute(k,'');
    else el.setAttribute(k,v);
  }
  for(const kid of kids.flat(Infinity)){if(kid==null||kid===false) continue;el.append(kid.nodeType?kid:document.createTextNode(String(kid)))}
  return el;
}
const $=(s,el=document)=>el.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const isUrl=p=>/^https?:\/\//i.test(p||'');
const cleanPath=p=>(p||'').trim().replace(/^["'“”‘’]+|["'“”‘’]+$/g,'').trim();
const cat=id=>S.categories.find(c=>c.id===id);
const catOf=f=>cat(f.category)||{id:'',name:'Uden hub',icon:'•',color:'var(--dim)'};
function titleFromPath(p){let s=p;if(isUrl(p)){try{s=decodeURIComponent(new URL(p).pathname.split('/').filter(Boolean).pop()||p)}catch{s=p}}else s=p.replace(/[\\/]+$/,'').split(/[\\/]/).pop();return s.replace(/\.[a-z0-9]{2,5}$/i,'')}
function midEllipsis(p,max){if(p.length<=max) return p;const a=Math.floor(max*.35),b=max-a-1;return p.slice(0,a)+'…'+p.slice(-b)}
const fmtDate=iso=>new Date(iso).toLocaleDateString('da-DK',{day:'numeric',month:'short',year:'numeric'});
function fmtSize(n){if(n==null) return '';if(n<1024) return n+' B';if(n<1048576) return (n/1024).toFixed(0)+' KB';return (n/1048576).toFixed(1).replace('.',',')+' MB'}
function relTime(iso){const m=Math.round((Date.now()-new Date(iso))/6e4);if(m<1) return 'lige nu';if(m<60) return 'for '+m+' min siden';const t=Math.round(m/60);if(t<24) return 'for '+t+' t siden';const d=Math.round(t/24);if(d<30) return 'for '+d+(d===1?' dag':' dage')+' siden';return fmtDate(iso)}
function daysUntil(due){const t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(due+'T00:00:00')-t)/864e5)}
function dueInfo(f){if(!f.due) return null;const n=daysUntil(f.due);let k='ok',t;
  if(n<0){k='bad';t=(-n)+(n===-1?' dag':' dage')+' over fristen'}else if(n===0){k='warn';t='i dag'}else if(n===1){k='warn';t='i morgen'}else{k=n<=7?'warn':'ok';t='om '+n+' dage'}
  return{n,k,t}}
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/864e5+1)/7)}
function fileType(p){
  const hx=H[p];if(hx&&hx.isDir) return 'folder';
  if(isUrl(p)){const clean=p.split('?')[0].toLowerCase();return(/\.(xlsx|xlsm|xlsb|xls|csv)$/.test(clean)||p.includes('/:x:/'))?'excel-url':'link'}
  const m=p.toLowerCase().match(/\.([a-z0-9]+)$/);const e=m?m[1]:'';
  if(['xlsx','xlsm','xlsb','xls','xltx','xltm'].includes(e)) return 'excel';
  if(e==='csv') return 'csv';
  if(['pbix','pbit','pbip'].includes(e)) return 'pbi';
  if(['docx','doc'].includes(e)) return 'word';
  if(e==='pdf') return 'pdf';
  if(['pptx','ppt'].includes(e)) return 'ppt';
  if(!e) return 'folder';
  return 'other';
}
function typeBadge(f){const [l,bg,fg]=TYPES[fileType(f.path)]||TYPES.other;return h('span',{class:'ftype',style:{background:bg,color:fg},title:fileType(f.path)},l)}
function statusOf(f){
  if(isUrl(f.path)) return{k:'url',t:'Online-link (kontrolleres ikke)'};
  const x=H[f.path];
  if(!x) return{k:'unk',t:'Ikke kontrolleret endnu'};
  if(x.timeout) return{k:'warn',t:'Intet svar – er netværksdrevet tilgængeligt?'};
  if(x.exists) return{k:'ok',t:'Filen findes'};
  return{k:'bad',t:'Filen blev ikke fundet – er den flyttet, omdøbt eller slettet?'};
}
const allTags=()=>{const s=new Map();S.files.forEach(f=>(f.tags||[]).forEach(t=>{if(!s.has(t.toLowerCase())) s.set(t.toLowerCase(),t)}));return[...s.values()].sort((a,b)=>a.localeCompare(b,'da'))};
const canonTag=t=>allTags().find(x=>x.toLowerCase()===t.toLowerCase())||t;
function updateTagList(){$('#taglist').replaceChildren(...allTags().map(t=>h('option',{value:t})))}

/* ================= API + gem ================= */
/* Desktop-app: i selve appen (WebView2) går kald via beskeder i stedet for http */
const native=window.chrome&&window.chrome.webview;
const pendingCalls=new Map();let callId=0;
if(native) native.addEventListener('message',e=>{const p=pendingCalls.get(e.data.id);if(!p) return;pendingCalls.delete(e.data.id);e.data.ok?p.res(e.data.data):p.rej(new Error(e.data.error))});
const nativeCall=(path,body)=>new Promise((res,rej)=>{const id=++callId;pendingCalls.set(id,{res,rej});native.postMessage({id,path,body:body===undefined?null:body})});
async function api(path,body){
  if(native) return nativeCall(path,body);
  const opt=body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','X-Dashboard':'1'},body:JSON.stringify(body)};
  const r=await fetch(path,opt);const data=await r.json().catch(()=>null);
  if(!r.ok) throw new Error((data&&data.error)||r.statusText);
  return data;
}
function setSaveState(m){saveMsg=m;const el=$('#savestate');if(el) el.textContent=m}
function save(){dirty=true;setSaveState('Gemmer…');clearTimeout(saveTimer);saveTimer=setTimeout(flushSave,400)}
function flushSave(){
  clearTimeout(saveTimer);if(!dirty) return savePromise;dirty=false;
  savePromise=api('/api/state',S).then(()=>setSaveState('Gemt')).catch(e=>{dirty=true;setSaveState('Kunne ikke gemme');toast('Kunne ikke gemme: '+e.message,'bad')});
  return savePromise;
}
addEventListener('pagehide',()=>{if(dirty&&S&&native) native.postMessage({id:0,path:'/api/state',body:S});else if(dirty&&S) fetch('/api/state',{method:'POST',keepalive:true,headers:{'Content-Type':'application/json','X-Dashboard':'1'},body:JSON.stringify(S)})});

/* ================= Filstatus ================= */
async function checkHealth(paths,manual){
  if(!S) return;
  const btn=$('#chk');if(btn&&manual) btn.textContent='Tjekker…';
  const uniq=[...new Set(paths||S.files.filter(f=>!isUrl(f.path)).map(f=>f.path))];
  let failed=false;
  for(let i=0;i<uniq.length;i+=24){
    try{const r=await api('/api/check',{paths:uniq.slice(i,i+24)});Object.assign(H,r.results)}
    catch(e){failed=true;if(manual) toast('Kunne ikke tjekke filer: '+e.message,'bad');break}
  }
  render();
  if(manual&&!failed){const bad=S.files.filter(f=>H[f.path]&&H[f.path].exists===false).length;toast(bad?bad+(bad===1?' fil blev ikke fundet':' filer blev ikke fundet'):'Alle filer blev fundet',bad?'bad':'ok')}
}

/* ================= Åbn / kopiér ================= */
async function openFile(f,reveal=false){
  try{
    if(isUrl(f.path)){
      if(reveal||fileType(f.path)!=='excel-url') window.open(f.path,'_blank');
      else h('a',{href:'ms-excel:ofe|u|'+f.path}).click();
    }else{await flushSave();if(!reveal) toast('Åbner '+f.title+'…');await api('/api/open',{path:f.path,reveal})}
    if(!reveal){f.lastOpened=new Date().toISOString();f.opens=(f.opens||0)+1;save()}
  }catch(e){toast(e.message,'bad')}
}
function copyPath(f){navigator.clipboard.writeText(f.path).then(()=>toast('Sti kopieret','ok'),()=>toast('Kunne ikke kopiere','bad'))}
function togglePin(f){f.pinned=!f.pinned;save();render()}

/* ================= Toast / menu / dialog ================= */
function toast(msg,kind=''){
  const host=document.querySelector('dialog[open]')||document.body;
  let box=host.querySelector(':scope>.toasts');if(!box){box=h('div',{class:'toasts'});host.append(box)}
  const t=h('div',{class:'toast '+kind},msg);box.append(t);setTimeout(()=>{t.remove();if(!box.children.length) box.remove()},kind==='bad'?6000:3200);
}
let openMenu=null;
function closeMenu(){if(openMenu){openMenu.remove();openMenu=null}}
function menu(anchor,items){
  closeMenu();
  const m=h('div',{class:'menu'},items.map(i=>i==='-'?h('hr'):h('button',{class:i.danger?'danger':'',onClick:()=>{closeMenu();i.fn()}},i.label)));
  document.body.append(m);const r=anchor.getBoundingClientRect(),w=m.offsetWidth,hh=m.offsetHeight;
  let x=Math.max(8,Math.min(r.right-w,innerWidth-w-8)),y=r.bottom+6;if(y+hh>innerHeight-8) y=Math.max(8,r.top-hh-6);
  m.style.left=x+'px';m.style.top=y+'px';openMenu=m;
}
addEventListener('mousedown',e=>{if(openMenu&&!openMenu.contains(e.target)) closeMenu()});
addEventListener('keydown',e=>{if(e.key==='Escape') closeMenu()});
function dialog(title,body,buttons){
  const d=h('dialog',{},h('div',{class:'dlg-h'},h('h2',{},title),h('button',{class:'x',title:'Luk',onClick:()=>d.close()},'✕')),h('div',{class:'dlg-b'},body),h('div',{class:'dlg-f'},buttons));
  d.addEventListener('close',()=>d.remove());document.body.append(d);d.showModal();return d;
}
const fld=(label,el,hint)=>h('label',{class:'fld'},h('span',{},label),el,hint?h('small',{},hint):null);
function tagInput(initial){
  let tags=[...initial];const wrap=h('div',{class:'taginput'});
  const inp=h('input',{list:'taglist',placeholder:'Skriv et tag og tryk Enter'});
  const draw=()=>wrap.replaceChildren(...tags.map(t=>{const col=tagColor(t);return h('span',{class:'chip on'+(col?' tc':''),style:col?{'--tc':col}:null},t,h('b',{class:'x',onClick:()=>{tags=tags.filter(x=>x!==t);draw()}},'×'))}),inp);
  const add=v=>{v=v.trim().replace(/,$/,'').trim();if(!v) return;v=canonTag(v);if(!tags.some(t=>t.toLowerCase()===v.toLowerCase())) tags.push(v);inp.value='';draw();inp.focus()};
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===','){e.preventDefault();add(inp.value)}else if(e.key==='Backspace'&&!inp.value&&tags.length){tags.pop();draw();inp.focus()}});
  inp.addEventListener('change',()=>add(inp.value));
  draw();wrap.get=()=>{if(inp.value.trim()) add(inp.value);return tags};return wrap;
}
const catSelect=v=>h('select',{},h('option',{value:'',selected:!v},'Uden hub'),S.categories.map(c=>h('option',{value:c.id,selected:v===c.id},c.icon+' '+c.name)));

/* ================= Routing ================= */
function parseRoute(){const raw=location.hash.replace(/^#/,'')||'/';const [p,q]=raw.split('?');return{parts:p.split('/').filter(Boolean),params:new URLSearchParams(q||'')}}
function resetUI(r){
  Object.assign(UI,{q:'',tags:new Set(),tagMode:'and',status:'aktiv',fav:false,cat:'',problem:false,allTags:false,select:false,sel:new Set(),order:[],last:null,pv:null});
  if(r.parts[0]==='cat') UI.cat=r.parts[1]||'';
  if(r.params.get('fav')) UI.fav=true;
  if(r.params.get('status')) UI.status=r.params.get('status');
  if(r.params.get('problem')) UI.problem=true;
}
addEventListener('hashchange',()=>{if(!S) return;resetUI(parseRoute());if(pendingTag){UI.tags.add(pendingTag);pendingTag=null}render();scrollTo(0,0)});

/* ================= Filtrering ================= */
function matches(f,o={}){
  if(UI.status!=='alle'&&(f.status||'aktiv')!==UI.status) return false;
  if(UI.fav&&!f.pinned) return false;
  if(!o.skipCat&&UI.cat&&f.category!==UI.cat) return false;
  if(UI.problem){const x=H[f.path];if(!(x&&x.exists===false)) return false}
  if(UI.q){const hay=[f.title,f.path,f.desc,(f.tags||[]).join(' '),catOf(f).name].join(' ').toLowerCase();for(const t of UI.q.toLowerCase().split(/\s+/).filter(Boolean)) if(!hay.includes(t)) return false}
  if(!o.skipTags&&UI.tags.size){const ft=f.tags||[],sel=[...UI.tags];
    if(UI.tagMode==='and'){if(!sel.every(t=>ft.includes(t))) return false}else{if(!sel.some(t=>ft.includes(t))) return false}}
  return true;
}
function sortFiles(arr){
  const m=S.settings.sort,coll=(a,b)=>a.localeCompare(b,'da');
  const cmp={

      const w=parseInt(app.style.getPropertyValue('--pane-w'),10);
      if(w&&w!==S.settings.paneWidth){S.settings.paneWidth=w;save()}

function palette(){
  closeMenu();
  const inp=h('input',{class:'pal-in',placeholder:'Skriv for at finde en fil eller hub'}),list=h('div',{class:'pal-list'});
  const d=h('dialog',{class:'pal'},inp,list,h('div',{class:'pal-hint'},'↑↓ vælg    Enter åbn    Shift+Enter vis i mappe    Esc luk'));
  let items=[],sel=0;
  const run=(it,rev)=>{d.close();if(it.kind==='cat') location.hash='#/hub/'+it.c.id;else openFile(it.f,rev)};
  const mark=()=>[...list.children].forEach((n,i)=>{n.classList.toggle('on',i===sel);if(i===sel) n.scrollIntoView({block:'nearest'})});
  const draw=()=>{
    list.replaceChildren(...(items.length?items.map((it,i)=>h('div',{class:'pal-i'+(i===sel?' on':''),onClick:()=>run(it,false),onMouseenter:()=>{sel=i;mark()}},
      it.kind==='cat'?h('span',{style:{fontSize:'22px',width:'34px',textAlign:'center'}},it.c.icon):typeBadge(it.f),
      h('div',{class:'mt'},h('b',{},it.kind==='cat'?it.c.name:it.f.title),h('small',{},it.kind==='cat'?'Hub':catOf(it.f).name+'  '+it.f.path)),
      h('span',{class:'k'},it.kind==='cat'?'Gå til':'Åbn'))):[h('div',{class:'hint',style:{padding:'14px'}},'Ingen match')]));
  };
  const calc=()=>{
    const q=inp.value.trim().toLowerCase(),res=[];
    S.categories.filter(c=>!q||c.name.toLowerCase().includes(q)).forEach(c=>res.push({kind:'cat',c}));
    let fl=S.files.filter(f=>f.status!=='arkiv');
    if(q){const toks=q.split(/\s+/);
      fl=fl.map(f=>{const hay=[f.title,f.path,f.desc,(f.tags||[]).join(' '),catOf(f).name].join(' ').toLowerCase();if(!toks.every(t=>hay.includes(t))) return null;const t=f.title.toLowerCase();return{f,s:t.startsWith(q)?3:t.includes(q)?2:1}}).filter(Boolean).sort((a,b)=>b.s-a.s||(b.f.opens||0)-(a.f.opens||0)).map(x=>x.f)}
    else{const seen=new Set();fl=[...fl.filter(f=>f.pinned),...fl.filter(f=>f.lastOpened).sort((a,b)=>b.lastOpened.localeCompare(a.lastOpened))].filter(f=>!seen.has(f.id)&&seen.add(f.id))}
    fl.slice(0,12).forEach(f=>res.push({kind:'file',f}));
    items=res;sel=0;draw();
  };
  inp.addEventListener('input',calc);
  inp.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){e.preventDefault();sel=Math.min(items.length-1,sel+1);mark()}
    else if(e.key==='ArrowUp'){e.preventDefault();sel=Math.max(0,sel-1);mark()}
    else if(e.key==='Enter'&&items[sel]){e.preventDefault();run(items[sel],e.shiftKey)}});
  d.addEventListener('click',e=>{if(e.target===d) d.close()});
  d.addEventListener('close',()=>d.remove());
  document.body.append(d);d.showModal();calc();inp.focus();
}

/* ================= Manual ================= */
const MANUAL_HTML=`
<h2 id="m-start">Kom i gang</h2>
<p>File Command Center samler adgangen til alle dine filer (dokumenter, mapper, links, hvad som helst) ét sted, uanset hvor de ligger. Dashboardet gemmer kun <b>stien</b> til filerne. Dine filer flyttes eller kopieres ikke.</p>
<p class="muted sm">Manualen er sidst opdateret 21. september 2026. Knappen "Udskriv eller gem som PDF" øverst til højre giver en udskrift uden sidebaren.</p>
<h3>Start og stop</h3>
<ol>
<li>Mappen skal indeholde tre filer: <code>index.html</code>, <code>dashboard-server.ps1</code> og <code>start-dashboard.bat</code>. Filerne <code>data.json</code> og mappen <code>backups</code> oprettes automatisk.</li>
<li>Dobbeltklik på <code>start-dashboard.bat</code>. Der åbner et sort vindue (hjælperen), og dashboardet åbner i browseren på <code>http://localhost:8787</code>.</li>
<li>Lad det sorte vindue stå åbent, mens du bruger dashboardet. Luk det for at stoppe.</li>
</ol>
<div class="note">Åbn ikke <code>index.html</code> ved at dobbeltklikke på den. Siden skal åbnes via hjælperen, ellers kan den hverken gemme eller åbne filer.</div>
<h3>Hvorfor en hjælper?</h3>
<p>En browser må ikke åbne programmer eller se, hvor filer ligger på din pc. Den lille hjælper gør det for dashboardet. Den lytter kun på din egen pc, kan kun åbne stier, som du selv har lagt ind i dashboardet, og åbner aldrig programfiler som .exe, .bat, .cmd og .ps1.</p>
<h3>Opdatering af filerne</h3>
<p>Erstat filerne i mappen. Hvis kun <code>index.html</code> er ændret, er det nok at genindlæse siden (F5). Hvis <code>dashboard-server.ps1</code> er ændret, skal du lukke det sorte vindue og starte <code>start-dashboard.bat</code> igen.</p>
<h3>Eksempeldata</h3>
<p>Første gang oprettes fire eksempelhubs: Affaldsdata, Økonomi, Stamdata og Diverse. Du kan omdøbe, ændre og slette dem frit.</p>

<h2 id="m-begreber">Begreber</h2>
<table>
<tr><th>Begreb</th><th>Betyder</th></tr>
<tr><td>Fil</td><td>En post i dashboardet med sti, navn, hub, tags og evt. beskrivelse og frist. Det kan også være en mappe eller et link.</td></tr>
<tr><td>Hub</td><td>En gruppe med farve og ikon og sin egen side: genveje, noter, frister og en filliste. Hver fil kan ligge i én hub. Vil du dele en hub op i mindre grupper, så brug tags.</td></tr>
<tr><td>Tag</td><td>Et frit mærke. En fil kan have flere tags, og tags bruges som filterknapper.</td></tr>
<tr><td>Favorit (★)</td><td>En fastgjort fil. Favoritter ligger først.</td></tr>
<tr><td>Genvej</td><td>Ordet bruges to steder. På en hubs side er "Genveje" hubbens favoritter som knapper. I filvælgeren er en genvej en gemt mappe (📌).</td></tr>
<tr><td>Arkiv</td><td>Skjuler en fil fra hverdagen uden at slette posten.</td></tr>
<tr><td>Frist</td><td>En dato på en fil, som vises på Overblik, på kortet og på hubbens side.</td></tr>
<tr><td>Hjælperen</td><td>Det sorte vindue, der kører, mens du bruger dashboardet.</td></tr>
</table>

<h2 id="m-arbejdsgang">Typisk arbejdsgang</h2>
<ol>
<li><b>Opret en hub</b> for et område, fx Affaldsdata (<b>Tilføj → Ny hub…</b>).</li>
<li><b>Tilføj filerne</b> med <b>Tilføj → Vælg filer…</b> (eller Scan mapper…). Vælg hubben og skriv evt. fælles tags i dialogen.</li>
<li><b>Finpuds med markér:</b> tryk på ☑ Markér, markér de filer, der hører sammen, og brug <b>Tilføj tag…</b>.</li>
<li><b>Fastgør</b> de filer, du bruger til daglig, med ☆. De bliver til genveje øverst på hubben.</li>
<li><b>Sæt frister</b> på filer til faste opgaver (Redigér…).</li>
<li><b>Hverdag:</b> tryk <kbd>Ctrl</kbd>+<kbd>K</kbd>, skriv et par bogstaver, og tryk Enter. Eller åbn filen fra Overblik eller hubben.</li>
<li><b>Ryd op:</b> tryk på "Tjek filer", ret de røde stier, og arkivér det, du ikke bruger mere.</li>
</ol>

<h2 id="m-overblik">Overblik</h2>
<p>Forsiden giver dig status og adgang til alt fra ét sted.</p>
<ul>
<li><b>Statuslinjen</b> øverst fortæller, om alle filer kan findes. Under den er der ét felt pr. aktiv fil. Farven viser status (se afsnittet <a href="#/help" onclick="return false">Status på filerne</a>), og den tynde streg under feltet har hubbens farve. Klik på et felt for at redigere filen, fx for at rette en sti.</li>
<li><b>Hubs</b> vises som store felter med antal filer, hvor mange der mangler, og hubbens mest brugte tags. Klik på et for at gå til hubben.</li>
<li><b>Frister</b> og <b>Kræver opmærksomhed</b> vises kun, når der er noget i dem. "Kræver opmærksomhed" viser filer, som ikke kan findes.</li>
<li><b>Alle filer</b> vises som kort. Favoritter ligger først, derefter er kortene grupperet efter hub i samme rækkefølge som i sidebaren. Farven på kortets øverste kant viser hubben. Knapperne over kortene filtrerer på én hub, og rullelisten vælger sorteringen inden for hver gruppe. "Filtre og tags" fører til det fulde bibliotek. Et klik på et tag på et kort åbner biblioteket med det tag valgt.</li>
<li><b>Senest åbnet</b> og <b>Mest brugte</b> ligger nederst og bygger på de filer, du åbner via dashboardet.</li>
</ul>
<h3>Sidebaren</h3>
<p>Overblik, Alle filer, Favoritter, Arkiv, Manual, og derunder dine hubs. Tallet ved hver hub er antallet af aktive filer. Tryk på + ved overskriften for at oprette en ny hub. Hold musen over en hub og tryk på ✎ for at redigere den. Nederst ser du, om hjælperen kører, om der er gemt, og du kan skifte mellem mørkt og lyst tema.</p>

<h2 id="m-tilfoej">Tilføj filer og mapper</h2>
<p>Tryk på <b>Tilføj</b> øverst til højre. Du kan vælge mellem:</p>
<table>
<tr><th>Valg</th><th>Bruges til</th></tr>
<tr><td>Vælg filer…</td><td>Bladr til filer og vælg flere ad gangen (se <a href="#/help" onclick="return false">Filvælgeren</a>).</td></tr>
<tr><td>Tilføj mapper…</td><td>Peg på en eller flere mapper, som skal åbnes i Stifinder, når du klikker på dem.</td></tr>
<tr><td>Scan mapper…</td><td>Find alle filer i en eller flere mapper. Du kan medtage undermapper. Der vises højst 500 filer pr. mappe.</td></tr>
<tr><td>Indsæt stier eller links…</td><td>Indsæt én sti eller ét link pr. linje. I Stifinder kan du markere flere filer og vælge "Kopiér som sti" (Shift + højreklik). Citationstegn fjernes automatisk.</td></tr>
<tr><td>Tilføj manuelt…</td><td>Udfyld alle felter selv, fx til et enkelt link. Findes stien allerede, spørger dashboardet, før den tilføjes igen.</td></tr>
<tr><td>Ny hub…</td><td>Opret en ny hub.</td></tr>
</table>
<h3>Tilføj mange filer på én gang</h3>
<p>Når du har valgt, scannet eller indsat flere filer, får du en samlet dialog. Vælg <b>hub</b> og <b>tags til alle</b> øverst, ret eventuelt navnene, og fravælg de filer, du ikke vil have med (knapperne "Vælg alle" og "Fravælg alle" hjælper). Filer, der allerede findes i dashboardet, er markeret "findes allerede" og er fravalgt som standard.</p>
<h3>Links</h3>
<p>Du kan også lægge links ind, fx til SharePoint eller OneDrive. Links til Excel-filer forsøges åbnet i Excel, og hvis det ikke virker, kan du bruge "Åbn i browser" i ⋯-menuen. Links kontrolleres ikke for, om de findes.</p>
<div class="note">Trækker du filer ind på siden, kan browseren ikke se, hvor de ligger på disken. Dashboardet åbner i stedet filvælgeren.</div>

<h2 id="m-vaelger">Filvælgeren</h2>
<p>Filvælgeren er dashboardets egen udgave af "Åbn fil". Den kan vise drev, mapper og netværksstier.</p>
<ul>
<li><b>Knapper øverst:</b> "Denne pc" viser dine drev. Dokumenter, Skrivebord, Overførsler og OneDrive vises, hvis de findes.</li>
<li><b>Navigation:</b> ← går tilbage til den mappe, du kom fra (Alt + ←). ↑ går én mappe op (Backspace). Stien under adressefeltet kan klikkes på hvert led. Du kan også skrive eller indsætte en sti i adressefeltet og trykke Enter, fx <code>&#92;&#92;server&#92;share&#92;mappe</code> til et netværksdrev.</li>
<li><b>Vælg flere mapper:</b> når du vælger mapper (til scanning eller for at tilføje dem), står der et afkrydsningsfelt ved hver mappe. Klik på feltet for at vælge mappen, og klik på selve navnet for at gå ind i den. Dine kryds bliver stående, mens du bladrer, så du kan vælge mapper på tværs af niveauer. "Markér alle undermapper" krydser alle mapper i den mappe, du står i. Har du ikke sat kryds, vælges den mappe, du står i.</li>
<li><b>Vælg filer:</b> klik på en fil for at markere den, og klik igen for at fjerne markeringen. "Vælg alle i mappen" markerer alle viste filer. Som standard vises alle filtyper. Sæt kryds ved "Vis kun Excel- og CSV-filer" for at snævre listen ind.</li>
<li><b>Gem en mappe som genvej:</b> tryk på "＋ Gem denne mappe som genvej", når du står i en mappe. Den får en 📌-knap ved siden af de andre og kan fjernes igen med × eller ved at trykke på knappen "★ Gemt som genvej".</li>
<li>Filvælgeren husker den mappe, du sidst brugte.</li>
<li>"Prøv Windows-dialog" åbner den almindelige Windows-dialog i stedet.</li>
</ul>

<h2 id="m-organiser">Organiser: hubs, tags og frister</h2>
<h3>Hubs</h3>
<p>Hver fil kan ligge i én <b>hub</b>, fx Affaldsdata eller Økonomi. En hub har sin egen side med:</p>
<ul>
<li>en beskrivelse og nøgletal (antal filer, favoritter, filer der mangler, sidst åbnet),</li>
<li><b>Genveje</b>: hubbens favoritter som store knapper, der åbner filen med ét klik (op til 14),</li>
<li>de nærmeste frister,</li>
<li><b>Noter</b>: et frit tekstfelt, der gemmes automatisk,</li>
<li>hubbens filer nederst med de samme filtre som biblioteket,</li>
<li>knapperne <b>Redigér hub</b> (navn, farve og beskrivelse) og <b>Ny fil i hubben</b>.</li>
</ul>
<p>Du kan vælge navn, ikon, farve og beskrivelse og flytte en hub op og ned i listen (↑ og ↓ i redigeringsdialogen). Sletter du en hub, beholdes filerne, men de mister deres hub. Filer uden hub vises kun under "Alle filer", hvor hubben står som "Uden hub". Vil du dele en hub op i mindre grupper, så brug tags.</p>
<h3>Tags</h3>
<p>Tags skrives i redigeringsdialogen (tryk Enter efter hvert tag). Eksisterende tags foreslås, og små/store bogstaver samles, så "Månedlig" og "månedlig" bliver ét tag. Tags bliver til filterknapper i biblioteket.</p>
<h3>Redigér en fil</h3>
<p>Tryk på ⋯ på et kort og vælg "Redigér…", eller klik på et felt i statuslinjen på Overblik. Du kan ændre:</p>
<ul>
<li><b>Sti eller link.</b> Skriv eller indsæt en sti, eller brug "Vælg fil…" og "Mappe…".</li>
<li><b>Navn</b> og <b>hub</b>.</li>
<li><b>Status</b>: Aktiv eller Arkiv.</li>
<li><b>Tags</b> og <b>beskrivelse</b>.</li>
<li><b>Frist</b> (dato) og en tekst om, hvad fristen er.</li>
<li><b>Fastgør som favorit.</b></li>
</ul>
<p>"Fjern" nederst til venstre fjerner posten fra dashboardet (ikke selve filen).</p>
<h3>Redigér flere filer på én gang</h3>
<p>Tryk på <b>☑ Markér</b> i værktøjslinjen i biblioteket eller på en hub-side. Så får hver fil et afkrydsningsfelt, og et klik på kortet markerer det i stedet for at åbne filen. Hold <kbd>Shift</kbd> nede for at markere alle filer mellem to klik. Tryk på <b>Vælg alle</b> for at markere alle de filer, der lige nu vises.</p>
<p>Nederst dukker en handlingslinje op med disse valg: <b>Tilføj tag…</b> (ét eller flere tags til alle valgte), <b>Fjern tag…</b>, <b>Hub…</b> (flyt til en anden hub), <b>Favorit</b>, <b>Arkivér</b> og <b>Fjern…</b> (fjerner posterne fra dashboardet, ikke selve filerne). Tryk på <b>Færdig</b> eller <kbd>Esc</kbd> for at forlade markér-tilstanden.</p>
<div class="note">Tip: filtrér først, fx på et tag eller en søgning, og tryk så "Vælg alle". Så kan du tagge alle filer, der matcher, i ét hug. Markerede filer, som et filter skjuler, tælles stadig med, og linjen viser, hvor mange der er skjult.</div>
<h3>Favoritter</h3>
<p>Tryk på ☆ på et kort for at gøre filen til favorit (★). Favoritter ligger først på Overblik og i listerne, og de vises som genveje på hubbens side.</p>
<h3>Frister</h3>
<p>Under redigering kan du sætte en frist og skrive, hvad fristen er. Frister vises på Overblik, på kortet og på hubbens side. Fristen bliver gul, når der er 7 dage eller mindre, og rød, når den er overskredet.</p>
<h3>Arkiv</h3>
<p>Arkiver filer, du ikke bruger lige nu, men som du vil beholde. Arkiverede filer forsvinder fra Overblik, hubbens tal, hurtigsøgning og statusrækken, men bevarer hub, tags og beskrivelse. Find dem under "Arkiv" i sidebaren. Vælg "Flyt til arkiv" eller "Gendan fra arkiv" i ⋯-menuen på kortet.</p>

<h2 id="m-find">Find og filtrer</h2>
<h3>Biblioteket</h3>
<p>Under "Alle filer" og på en hubs side kan du:</p>
<ul>
<li>søge i navn, sti, tags, beskrivelse og hub,</li>
<li>skifte mellem <b>Aktive</b>, <b>Arkiv</b> og <b>Alle</b>,</li>
<li>vise kun <b>favoritter</b>, eller kun filer der <b>mangler</b> (knappen vises kun, når en fil mangler),</li>
<li>vælge <b>hub</b> og <b>tags</b> med filterknapper (hub-knapperne vises under "Alle filer"). Tallet ved hvert tag viser, hvor mange filer der er tilbage,</li>
<li>skifte mellem "Match: alle valgte" og "mindst ét valgt", når flere tags er valgt,</li>
<li>sortere efter senest brugt, navn, mest brugt, sidst ændret (fil), senest tilføjet eller frist. Favoritter ligger altid først,</li>
<li>vælge visning som <b>Kort</b> eller <b>Liste</b>,</li>
<li>trykke på <b>☑ Markér</b> for at markere flere filer og redigere dem samlet (se "Redigér flere filer på én gang" under Organiser),</li>
<li>trykke på "Ryd filtre" for at nulstille.</li>
</ul>
<h3>Hurtigsøg</h3>
<p>Tryk <kbd>Ctrl</kbd>+<kbd>K</kbd> (eller <kbd>/</kbd>, når du ikke skriver i et felt). Skriv et par bogstaver, brug ↑↓ og tryk Enter for at åbne. <kbd>Shift</kbd>+<kbd>Enter</kbd> viser filen i Stifinder. Uden tekst vises dine hubs, favoritter og senest åbnede. Hubs kan også vælges, og så går du direkte til dem.</p>

<h2 id="m-aabn">Åbn filer og mapper</h2>
<p>Klik på kortets titel eller ikon, på <b>Åbn</b>-knappen, eller på en genvejsknap. Filen åbner i det program, Windows har knyttet til filtypen (typisk Excel). Mapper åbner i Stifinder. Efter åbning forsøger hjælperen at hente Excel- eller Stifinder-vinduet frem foran browseren.</p>
<h3>Menuen ⋯ på et kort</h3>
<table>
<tr><th>Valg</th><th>Virkning</th></tr>
<tr><td>Åbn</td><td>Åbner filen eller mappen.</td></tr>
<tr><td>Vis i mappe</td><td>Åbner Stifinder med filen markeret. For links hedder valget "Åbn i browser". Findes ikke for mapper.</td></tr>
<tr><td>Kopiér sti</td><td>Kopierer stien til udklipsholderen.</td></tr>
<tr><td>Redigér…</td><td>Ændr sti, navn, hub, tags, beskrivelse, frist og status.</td></tr>
<tr><td>Favorit / Arkiv</td><td>Skifter status.</td></tr>
<tr><td>Fjern fra dashboardet</td><td>Sletter posten (ikke selve filen). Du bliver spurgt først.</td></tr>
</table>

<h2 id="m-status">Status på filerne</h2>
<p>Dashboardet kontrollerer filerne, når siden åbnes, hver 5. minut (mens fanen er synlig) og når du trykker på <b>Tjek filer</b>. Kontrollen viser også, hvornår filen sidst er ændret, og hvor stor den er.</p>
<table>
<tr><th>Farve</th><th>Betyder</th></tr>
<tr><td>Grøn</td><td>Filen eller mappen findes.</td></tr>
<tr><td>Rød</td><td>Filen blev ikke fundet. Den er flyttet, omdøbt eller slettet. Ret stien via "Redigér…" eller "Ret sti".</td></tr>
<tr><td>Gul</td><td>Ingen svar inden for ca. 6 sekunder. Typisk et netværksdrev, som ikke er forbundet.</td></tr>
<tr><td>Blå</td><td>Online-link. Kontrolleres ikke.</td></tr>
<tr><td>Grå</td><td>Ikke kontrolleret endnu.</td></tr>
</table>

<h2 id="m-data">Data og backup</h2>
<ul>
<li><b>Hvor:</b> alt gemmes i <code>data.json</code> i samme mappe som hjælperen. Ændringer gemmes automatisk et øjeblik efter, at du har lavet dem. Nederst i sidebaren står "Gemt". Her ligger også dine hubs og deres noter, gemte mappegenveje og indstillinger (tema, visning og sortering).</li>
<li><b>Dagligt:</b> ved dagens første ændring lægges en kopi af den gamle <code>data.json</code> i mappen <code>backups</code> (<code>data-ÅÅÅÅMMDD.json</code>). De seneste 30 beholdes. Kopien viser altså tilstanden fra før dagens ændringer.</li>
<li><b>Før sletning:</b> hvis en gemning vil give færre filer end før, lægges først en kopi i <code>backups</code> som <code>gemt-foer-sletning-…</code>. De seneste 20 beholdes.</li>
<li><b>Manuelt:</b> "Backup" nederst i sidebaren har "Hent backup" (en .json-fil), "Indlæs backup…" (erstatter alt i dashboardet, og du bliver spurgt først) og "Nulstil brugsstatistik" (nulstiller senest åbnet og mest brugte).</li>
<li><b>Gendan en kopi:</b> luk hjælperen, kopiér en fil fra <code>backups</code> over <code>data.json</code>, og start igen. Eller brug "Indlæs backup…".</li>
<li><b>Flyt til en anden pc:</b> kopiér hele mappen inklusive <code>data.json</code>. Stierne skal findes på den nye pc for at være grønne.</li>
</ul>
<div class="note">Bruger du dashboardet fra flere mapper eller flere pc'er, har hver sin <code>data.json</code>. Har du for nylig flyttet filerne til en ny mappe og mangler dine data, så kig efter <code>data.json</code> i den gamle mappe.</div>

<h2 id="m-genvejstaster">Genvejstaster</h2>
<table>
<tr><th>Tast</th><th>Virkning</th></tr>
<tr><td><kbd>Ctrl</kbd>+<kbd>K</kbd> eller <kbd>/</kbd></td><td>Åbn hurtigsøg.</td></tr>
<tr><td><kbd>↑</kbd> <kbd>↓</kbd> <kbd>Enter</kbd></td><td>Vælg og åbn i hurtigsøg.</td></tr>
<tr><td><kbd>Shift</kbd>+<kbd>Enter</kbd></td><td>Vis den valgte fil i Stifinder.</td></tr>
<tr><td><kbd>Esc</kbd></td><td>Luk en dialog, hurtigsøgning eller menu, eller forlad markér-tilstand.</td></tr>
<tr><td><kbd>Shift</kbd>+klik</td><td>I markér-tilstand: markér et helt område mellem to filer.</td></tr>
<tr><td><kbd>Alt</kbd>+<kbd>←</kbd></td><td>Tilbage i filvælgeren.</td></tr>
<tr><td><kbd>Backspace</kbd></td><td>Én mappe op i filvælgeren.</td></tr>
<tr><td><kbd>Enter</kbd></td><td>Tilføj et tag, eller gå til stien i filvælgerens adressefelt.</td></tr>
</table>

<h2 id="m-fejl">Fejlfinding</h2>
<table>
<tr><th>Problem</th><th>Løsning</th></tr>
<tr><td>Siden siger "Hjælperen svarer ikke", eller du ser "NetworkError" og "Kunne ikke gemme"</td><td>Hjælperen kører ikke. Start <code>start-dashboard.bat</code>. Genindlæs ikke siden, før den kører, og lav derefter en lille ændring, så bliver alt gemt.</td></tr>
<tr><td>Det sorte vindue siger, at porten er i brug</td><td>Dashboardet kører sandsynligvis allerede. Åbn <code>http://localhost:8787</code> i browseren.</td></tr>
<tr><td>Det sorte vindue åbner og lukker igen med en fejl om scripts</td><td>Din pc blokerer måske PowerShell-scripts. Det kan være en indstilling, som din it-afdeling styrer.</td></tr>
<tr><td>Filen åbner ikke</td><td>Er statusprikken rød eller gul? Så findes filen ikke, eller drevet er ikke forbundet. Læs ellers fejlteksten i browseren og i det sorte vindue, hvor der står "Åbner: …" for hver fil.</td></tr>
<tr><td>Excel eller mappen åbner, men ligger bag browseren</td><td>Hjælperen forsøger at hente vinduet frem og skriver i det sorte vindue, om det lykkedes. Lykkes det ikke, kan du finde vinduet i proceslinjen.</td></tr>
<tr><td>Filvælgeren viser ikke det, du leder efter</td><td>Fjern evt. kryds ved "Vis kun Excel- og CSV-filer". Skjulte og systemfiler vises ikke. Skriv eller indsæt en netværkssti i adressefeltet.</td></tr>
<tr><td>Én fil er "væk"</td><td>Tjek filtrene (sæt Aktive/Arkiv/Alle til "Alle"), og se, om den ligger i Arkiv. Kig ellers i <code>backups</code>.</td></tr>
<tr><td>Knappen "Prøv Windows-dialog" åbner ingenting</td><td>Windows' almindelige dialog kan af og til ikke komme frem, når den startes fra hjælperen. Brug dashboardets egen filvælger, som ikke afhænger af den.</td></tr>
<tr><td>Filvælgeren siger "Mappen findes ikke eller kan ikke nås"</td><td>Tjek stavemåden, og at netværksdrevet er forbundet. Prøv at åbne stien i Stifinder.</td></tr>
<tr><td>Et klik åbner ikke filen, men markerer den</td><td>Du er i markér-tilstand. Tryk på "Færdig" eller <kbd>Esc</kbd>.</td></tr>
<tr><td>To knapper for samme mappe i filvælgeren</td><td>Hold musen over knappen for at se stien. Er de forskellige, er det to forskellige mapper.</td></tr>
</table>

<h2 id="m-graenser">Begrænsninger og sikkerhed</h2>
<ul>
<li>Dashboardet gemmer kun stier og dine oplysninger om filerne. Det viser ikke filernes indhold.</li>
<li>En fil kan kun ligge i én hub, og hubs kan ikke have underhubs. Brug tags til en mere detaljeret opdeling.</li>
<li>Det er lavet til Windows og til én bruger. Brug kun ét browservindue ad gangen, ellers kan det ene overskrive det andet.</li>
<li>Hjælperen kan kun nås fra din egen pc. Den åbner kun stier, der er lagt ind i dashboardet, og aldrig programfiler.</li>
<li>Ændringer i filerne uden for dashboardet (flytning, omdøbning) opdages ved næste kontrol og vises som rød status.</li>
</ul>

<h2 id="m-aendringer">Ændringer</h2>
<p>Seneste ændringer, med de nyeste først.</p>
<table>
<tr><th>Dato</th><th>Ændring</th></tr>
<tr><td>22. september 2026</td><td>Dashboardet hedder nu File Command Center og håndterer alle filtyper, ikke kun Excel og CSV: filvælgeren og Scan mapper viser som standard alt, og forhåndsvisningsruden virker nu også på billeder, PDF'er og tekstfiler. Forhåndsvisningsruden kan trækkes bredere eller smallere i venstre kant.</td></tr>
<tr><td>21. september 2026</td><td>Kategorier og hubs er slået sammen til hubs. Alle hubs har egen side med genveje og noter. Gamle kategorier er blevet til hubs.</td></tr>
<tr><td>21. september 2026</td><td>Markér-tilstand: tilføj eller fjern tags, skift hub, favorit, arkivér og fjern for flere filer ad gangen.</td></tr>
<tr><td>21. september 2026</td><td>Filvælgeren kan vælge flere mapper, og Scan mapper kan scanne flere mapper på én gang.</td></tr>
<tr><td>21. september 2026</td><td>Filvælgeren har tilbage- og op-knapper, sti-navigation og gemte mappegenveje. Mapper kan lægges ind som poster og åbnes i Stifinder.</td></tr>
<tr><td>21. september 2026</td><td>Overblik viser alle filer som kort, med favoritter først og grupperet efter hub.</td></tr>
</table>

function helpView(){
  const doc=h('article',{class:'manual'});doc.innerHTML=MANUAL_HTML;
  doc.querySelectorAll('a[href="#/help"]').forEach(a=>{const t=a.textContent.toLowerCase();const map={'status på filerne':'m-status','filvælgeren':'m-vaelger'};const id=map[t];if(id) a.addEventListener('click',e=>{e.preventDefault();document.getElementById(id).scrollIntoView({behavior:'smooth',block:'start'})})});
  const go=id=>document.getElementById(id).scrollIntoView({behavior:'smooth',block:'start'});
  const toc=h('nav',{class:'toc'},h('b',{},'Indhold'),...[...doc.querySelectorAll('h2[id]')].map(x=>h('button',{class:'crumb',onClick:()=>go(x.id)},x.textContent)));
  return[
    h('div',{class:'top'},h('div',{},h('div',{class:'sub'},'Hjælp'),h('h1',{},'Manual')),h('div',{class:'spacer'}),h('button',{class:'btn',onClick:()=>print()},'Udskriv eller gem som PDF')),
    h('div',{class:'manual-wrap'},toc,doc)
  ];
}

/* ================= Start ================= */
function showMessage(title,html){document.body.replaceChildren(h('div',{style:{maxWidth:'640px',margin:'12vh auto',padding:'0 20px',position:'relative',zIndex:1}},h('h1',{style:{font:'600 32px var(--display)'}},title),h('div',{html})))}
async function ping(){
  try{await api('/api/ping');if(!helperOnline){helperOnline=true;render()}}
  catch{if(helperOnline){helperOnline=false;render()}}
}
async function init(){
  if(location.protocol==='file:'){showMessage('Start hjælperen først','<p>Siden er åbnet direkte fra en fil. Den skal i stedet køre via den lille hjælper.</p><p>Dobbeltklik på <b>start-dashboard.bat</b> i mappen – så åbner dashboardet af sig selv på <b>http://localhost:8787</b>.</p>');return}
  try{const s=await api('/api/state');if(s&&Array.isArray(s.files)) S=migrate(s);else{S=defaultState();save()}}
  catch(e){showMessage('Hjælperen svarer ikke','<p>Dashboardet kunne ikke få forbindelse til hjælperen ('+e.message+').</p><p>Dobbeltklik på <b>start-dashboard.bat</b>, og genindlæs siden.</p>');return}
  resetUI(parseRoute());render();checkHealth();initPaneResize();
  setInterval(ping,15000);
  setInterval(()=>{if(!document.hidden) checkHealth()},5*60*1000);
  setInterval(()=>{const c=$('#clock');if(c) c.textContent=new Date().toLocaleTimeString('da-DK',{hour:'2-digit',minute:'2-digit'})},20000);
}
init();
</script>
